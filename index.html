<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Divide & Conquer Idle — split problems, master algorithms." />
    <meta name="theme-color" content="#0a1418" />
    <title>Divide &amp; Conquer Idle</title>
<style>
      :root {
        --bg: #0a1418;
        --bg-elev: #11202a;
        --cyan: #5eead4;
        --cyan-dim: #2dd4bf;
        --text: #e2e8f0;
        --text-dim: #94a3b8;
        --border: #1e3340;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }
      #app { width: 100vw; height: 100vh; }
      #topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 36px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-dim);
        background: linear-gradient(to bottom, rgba(17,32,42,0.85), rgba(17,32,42,0.0));
        pointer-events: none;
        z-index: 10;
      }
      #topbar .title { color: var(--cyan); }
      #bottombar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px 12px;
        font-size: 12px;
        letter-spacing: 0.05em;
        color: var(--text-dim);
        background: linear-gradient(to top, rgba(17,32,42,0.95), rgba(17,32,42,0.0));
        z-index: 10;
        gap: 12px;
      }
      #bottombar .text { flex: 1; min-width: 0; }
      #bottombar .text .status {
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-variant-numeric: tabular-nums;
      }
      #bottombar .text .hint {
        margin-top: 4px;
        font-size: 11px;
        color: var(--text-dim);
        line-height: 1.4;
      }
      #bottombar .text .hint .accent { color: var(--cyan); }
      #bottombar button {
        flex-shrink: 0;
        background: transparent;
        color: var(--cyan);
        border: 1px solid var(--cyan);
        border-radius: 4px;
        padding: 8px 16px;
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 120ms ease, color 120ms ease;
      }
      #bottombar button:hover,
      #bottombar button:focus {
        background: var(--cyan);
        color: var(--bg);
        outline: none;
      }
      #bottombar button:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <div id="topbar">
      <span class="title">▌divide &amp; conquer idle</span>
    </div>
    <div id="app"></div>
    <div id="bottombar">
      <div class="text">
        <div class="status" id="status-line">TUTORIAL · CLOSEST PAIR</div>
        <div class="hint" id="phase-hint">click on the field to drop a vertical split.</div>
<nav aria-label="Rechtliche Hinweise" lang="de" style="display:flex;flex-wrap:wrap;gap:8px;font:12px/1.6 system-ui,sans-serif">
<a style="color:inherit;text-decoration:underline" href="https://future-pulse.de/spiele-rechtliches/#impressum" target="_blank" rel="noopener noreferrer">Impressum</a>
<a style="color:inherit;text-decoration:underline" href="https://future-pulse.de/spiele-rechtliches/#datenschutz" target="_blank" rel="noopener noreferrer">Datenschutz</a>
<a style="color:inherit;text-decoration:underline" href="https://future-pulse.de/spiele-rechtliches/#lizenzen" target="_blank" rel="noopener noreferrer">Lizenzen</a>
</nav>
      </div>
      <button type="button" id="reset-btn" aria-label="Reset tutorial">↻ Reset</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
