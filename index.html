<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Divide & Conquer Idle — split problems, master algorithms." />
    <meta name="theme-color" content="#0a1418" />
    <title>Divide &amp; Conquer Idle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a1418;
        --bg-elev: #11202a;
        --cyan: #5eead4;
        --cyan-dim: #2dd4bf;
        --text: #e2e8f0;
        --text-dim: #94a3b8;
        --border: #1e3340;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }
      #app { width: 100vw; height: 100vh; }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        font-size: 12px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-dim);
        z-index: 10;
      }
      #hud .title { color: var(--cyan); }
      #hud .stat { font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="hud">
      <span class="title">▌divide &amp; conquer idle</span>
      <span class="stat" id="hud-stat">TUTORIAL · SPLIT THE FIELD</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
